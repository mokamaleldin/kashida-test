name: Egypt trends experiment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: egypt-trends-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Test Egypt trends sources'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - name: Find existing Facebook cache without collecting
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TREND_CACHE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=demo-media-cache-v2&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')
          printf 'run_id=%s\n' "$TREND_CACHE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.run_id != ''
        with:
          name: demo-media-cache-v2
          path: data
          run-id: ${{ steps.cache.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Collect Egypt signals and send at most three messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u trends_probe.py --send
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egypt-trend-results
          retention-days: 3
          if-no-files-found: ignore
          path: |
            data/egypt_trends.json
            data/trends_status.json
            data/trend_messages.json
