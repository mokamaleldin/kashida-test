name: Telegram demo commands
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Listen to demo commands for this many minutes'
        type: choice
        options: ['15', '30', '60']
        default: '60'
      refresh_samples:
        description: 'Refresh posts and group names once (up to 7 credits); otherwise reuse cache'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-demo-listener
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || contains(fromJSON('["Start 30-minute Telegram demo","Update Telegram media demo","Show all collected Telegram posts","Enable Egypt trends bot","Simplify trends and speed up demo","Restart Telegram demo for 60 minutes"]'), github.event.head_commit.message) }}
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Start 30-minute Telegram demo' || github.event.head_commit.message == 'Update Telegram media demo' || github.event.head_commit.message == 'Show all collected Telegram posts' || github.event.head_commit.message == 'Enable Egypt trends bot' || github.event.head_commit.message == 'Simplify trends and speed up demo' || github.event.head_commit.message == 'Restart Telegram demo for 60 minutes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trends_available: ${{ steps.trendcache.outputs.run_id != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - name: Find saved media samples
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEMO_CACHE_NAME=demo-media-cache-v2
          DEMO_CACHE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$DEMO_CACHE_NAME&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')
          if [ -z "$DEMO_CACHE_RUN" ]; then
            DEMO_CACHE_NAME=demo-media-cache
            DEMO_CACHE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$DEMO_CACHE_NAME&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')
          fi
          printf 'run_id=%s\n' "$DEMO_CACHE_RUN" >> "$GITHUB_OUTPUT"
          printf 'cache_name=%s\n' "$DEMO_CACHE_NAME" >> "$GITHUB_OUTPUT"
      - name: Keep this restart within saved data
        if: github.event.head_commit.message == 'Restart Telegram demo for 60 minutes' && (steps.cache.outputs.run_id == '' || steps.cache.outputs.cache_name != 'demo-media-cache-v2')
        run: |
          echo 'Saved media cache unavailable; stopping without collecting Facebook again.'
          exit 1
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.run_id != ''
        with:
          name: ${{ steps.cache.outputs.cache_name }}
          path: data
          run-id: ${{ steps.cache.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Collect source samples once when needed
        if: steps.cache.outputs.run_id == '' || steps.cache.outputs.cache_name != 'demo-media-cache-v2' || inputs.refresh_samples == true
        env:
          SOCIALAPIS_API_KEY: ${{ secrets.SOCIALAPIS_API_KEY }}
        run: python -u prepare_demo_cache.py
      - name: Find saved trend summary without collecting again
        id: trendcache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TREND_SUMMARY_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=egypt-trend-results&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')
          printf 'run_id=%s\n' "$TREND_SUMMARY_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.trendcache.outputs.run_id != ''
        with:
          name: egypt-trend-results
          path: data
          run-id: ${{ steps.trendcache.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Register commands and verify cached trend display
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_DEMO: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Simplify trends and speed up demo' }}
        run: python -u telegram_demo.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: demo-commands-check
          path: data/demo_smoke.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: demo-media-cache-v2
          path: |
            data/demo_media_samples.json
            data/demo_sources.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: steps.trendcache.outputs.run_id != ''
        with:
          name: bot-trend-cache
          path: data/egypt_trends.json
          retention-days: 3
  listen:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: demo-media-cache-v2
          path: data
      - uses: actions/download-artifact@v4
        if: needs.check.outputs.trends_available == 'true'
        with:
          name: bot-trend-cache
          path: data
      - name: Listen for private chat commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEMO_MINUTES: ${{ inputs.minutes || '60' }}
        run: python -u telegram_demo.py --minutes "$DEMO_MINUTES"
